name: Deploy course website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.12"
          python-version: "3.11"
          enable-cache: true

      - name: Install website dependencies
        run: uv sync --locked --only-group site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build website
        run: uv run --no-sync mkdocs build --strict --config-file website/mkdocs.yml

      - name: Verify public artifact boundary
        run: |
          test ! -e website/src/reference
          test ! -e website/src/student-work
          test ! -e website/build/reference
          test ! -e website/build/student-work
          if find website/build -type f \( -iname '*.docx' -o -iname '*.xls' -o -iname '*.xlsx' \) -print -quit | grep -q .; then
            echo "Office document found in public website artifact"
            exit 1
          fi

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
