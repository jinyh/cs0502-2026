<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>汉诺塔递归与调用栈动画</title>
  <style>
    :root { --blue:#004098; --ink:#172033; --muted:#617086; --line:#cad7e8; --pale:#eef5ff; --gold:#f3b63c; --green:#27845d; --red:#b84242; }
    *{box-sizing:border-box} body{margin:0;background:#f3f6fa;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif} main{max-width:1280px;margin:auto;padding:22px}
    header{border-left:10px solid var(--blue);padding:3px 0 3px 18px} h1{margin:0 0 5px;color:var(--blue);font-size:clamp(26px,3vw,38px)} header p{margin:0;color:var(--muted);font-size:17px}
    .predict{margin:14px 0;background:#fff8e7;border:1px solid #efd18b;padding:11px 15px;font-size:17px}
    .layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(330px,.9fr);gap:20px}.panel{background:white;border:1px solid var(--line);padding:16px}.panel h2{margin:0 0 8px;color:var(--blue);font-size:21px}
    .towers{height:390px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end;border-bottom:8px solid #8a6846;padding:20px 7px 0}.tower{height:330px;position:relative;display:flex;flex-direction:column-reverse;align-items:center;padding-bottom:10px}.pole{position:absolute;bottom:0;width:9px;height:285px;background:#8a6846;border-radius:5px 5px 0 0;z-index:0}.disk{height:32px;border:2px solid #163b72;border-radius:8px;background:linear-gradient(#4e93d0,#1769aa);z-index:1;margin-top:3px;color:white;display:grid;place-items:center;font-weight:700;box-shadow:0 2px 3px #6a7687;animation:appear .25s}.tower-label{position:absolute;bottom:-48px;font-size:20px;font-weight:700;color:var(--blue)}
    @keyframes appear{from{opacity:.25;transform:translateY(-10px)}}
    .stack-wrap{min-height:390px;display:flex;flex-direction:column}.stack-label{color:var(--muted);font-size:14px}.frames{display:flex;flex-direction:column;gap:7px;margin-top:7px}.frame{border:2px solid #8caed6;background:var(--pale);padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.frame.top{border-color:var(--gold);background:#fff5d8}.frame .call{font-weight:800}.frame .stage{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#4e5c70;font-size:14px;margin-top:3px}.empty{display:grid;place-items:center;min-height:220px;color:#9aa5b5}
    .event{margin-top:18px;background:white;border:1px solid var(--line);min-height:82px;padding:14px 17px}.event strong{color:var(--blue)}.event .move{color:var(--green);font-weight:700;font-size:20px;margin-top:5px}.event .base{color:var(--red);font-weight:700;margin-top:5px}
    .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}button,select{font:16px inherit;border-radius:6px;padding:10px 17px}button{border:0;background:var(--blue);color:white;cursor:pointer}button.secondary{background:#5d6b7e}button:disabled{opacity:.45;cursor:not-allowed}select{background:white;border:1px solid var(--line)}.stats{margin-left:auto;color:var(--muted)}
    .lesson{margin-top:14px;color:var(--muted);font-size:15px}.lesson b{color:var(--ink)}
    @media(max-width:850px){main{padding:14px}.layout{grid-template-columns:1fr}.towers{height:330px}.tower{height:270px}.pole{height:225px}.stats{width:100%;margin-left:0}}
  </style>
</head>
<body>
<main>
  <header><h1>汉诺塔：递归与调用栈</h1><p>圆盘移动和函数调用同步显示，基本情形统一为 n = 0 立即返回</p></header>
  <div class="predict"><strong>先预测：</strong>n = 3 时最多同时存在几个 Hanoi 栈帧？总共移动多少次？到达 Hanoi(0, …) 时会不会移动圆盘？</div>
  <section class="layout">
    <article class="panel"><h2>三根塔柱</h2><div class="towers" id="towers" aria-label="汉诺塔圆盘状态"></div></article>
    <article class="panel stack-wrap"><h2>调用栈</h2><div class="stack-label">栈顶在上方；黄色栈帧正在执行</div><div class="frames" id="frames" aria-label="递归调用栈"></div></article>
  </section>
  <div class="event" id="event" aria-live="polite"></div>
  <div class="bar">
    <label>圆盘数 <select id="count"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label>
    <button id="next">下一步</button><button id="auto" class="secondary">自动播放</button><button id="reset" class="secondary">重置</button>
    <span class="stats" id="stats"></span>
  </div>
  <div class="lesson"><b>观察重点：</b>调用递归函数时压入栈帧；n = 0 的栈帧不搬盘并立即返回；搬盘是当前栈帧中的普通操作。</div>
</main>
<script>
  const names=['X','Y','Z'];
  const towersEl=document.getElementById('towers'), framesEl=document.getElementById('frames'), eventEl=document.getElementById('event'), statsEl=document.getElementById('stats');
  const nextBtn=document.getElementById('next'), autoBtn=document.getElementById('auto'), countEl=document.getElementById('count');
  let events=[], index=-1, timer=null, diskCount=3;
  const clone=x=>JSON.parse(JSON.stringify(x));

  function buildTrace(n){
    const towers=[[],[],[]]; for(let d=n;d>=1;d--)towers[0].push(d);
    const frames=[]; const out=[]; let moves=0,maxDepth=0,id=0;
    const snapshot=(kind,text,detail='')=>out.push({kind,text,detail,towers:clone(towers),frames:clone(frames),moves,maxDepth});
    function visit(k,from,aux,to){
      const frame={id:++id,n:k,from:names[from],aux:names[aux],to:names[to],stage:'刚进入，准备检查基本情形'};
      frames.push(frame); maxDepth=Math.max(maxDepth,frames.length);
      snapshot('push',`压栈 Hanoi(${k}, ${frame.from}, ${frame.aux}, ${frame.to})`,'新调用还没有完成，计算机先保存参数和返回位置。');
      if(k===0){
        frame.stage='n = 0，立即返回'; snapshot('base','到达基本情形 n = 0','不移动任何圆盘。');
        frames.pop(); snapshot('pop',`弹栈 Hanoi(0, ${frame.from}, ${frame.aux}, ${frame.to})`,'控制权回到上一层调用。'); return;
      }
      frame.stage=`等待 Hanoi(${k-1}, ${names[from]}, ${names[to]}, ${names[aux]}) 返回`;
      snapshot('descend','执行第一次递归',`先把上面的 ${k-1} 个圆盘从 ${names[from]} 移到 ${names[aux]}。`);
      visit(k-1,from,to,aux);
      frame.stage=`第一次递归完成，移动盘 ${k}`; snapshot('resume',`恢复 Hanoi(${k}, ${frame.from}, ${frame.aux}, ${frame.to})`,'现在执行这个栈帧中尚未完成的搬盘动作。');
      const disk=towers[from].pop(); towers[to].push(disk); moves++;
      frame.stage=`盘 ${k} 已移动，准备第二次递归`; snapshot('move',`移动盘 ${k}：${names[from]} → ${names[to]}`,`这是普通操作，没有产生新栈帧。`);
      frame.stage=`等待 Hanoi(${k-1}, ${names[aux]}, ${names[from]}, ${names[to]}) 返回`;
      snapshot('descend','执行第二次递归',`把 ${k-1} 个圆盘从 ${names[aux]} 移到 ${names[to]}。`);
      visit(k-1,aux,from,to);
      frame.stage='三步完成，准备返回'; snapshot('return',`Hanoi(${k}, ${frame.from}, ${frame.aux}, ${frame.to}) 完成`,'这个调用已经没有尚未完成的工作。');
      frames.pop(); snapshot('pop',`弹栈 Hanoi(${k}, ${frame.from}, ${frame.aux}, ${frame.to})`,frames.length?'继续执行上一层调用。':'最外层调用结束。');
    }
    snapshot('ready','准备开始','点击“下一步”，观察调用怎样压栈。'); visit(n,0,1,2);
    return out;
  }
  function renderTowers(state){
    towersEl.innerHTML='';
    state.towers.forEach((stack,t)=>{
      const tower=document.createElement('div'); tower.className='tower';
      tower.innerHTML='<div class="pole"></div>';
      stack.forEach(d=>{const disk=document.createElement('div');disk.className='disk';disk.style.width=`${42+d*31}px`;disk.textContent=d;tower.appendChild(disk)});
      const label=document.createElement('div');label.className='tower-label';label.textContent=names[t];tower.appendChild(label);towersEl.appendChild(tower);
    });
  }
  function renderFrames(state){
    if(!state.frames.length){framesEl.innerHTML='<div class="empty">调用栈为空</div>';return}
    framesEl.innerHTML=[...state.frames].reverse().map((f,i)=>`<div class="frame ${i===0?'top':''}"><div class="call">Hanoi(${f.n}, ${f.from}, ${f.aux}, ${f.to})</div><div class="stage">${f.stage}</div></div>`).join('');
  }
  function render(){
    const state=events[index]; renderTowers(state); renderFrames(state);
    const extra=state.kind==='move'?`<div class="move">${state.text}</div>`:state.kind==='base'?`<div class="base">${state.text}</div>`:`<strong>${state.text}</strong>`;
    eventEl.innerHTML=`${extra}<div>${state.detail}</div>`;
    statsEl.textContent=`事件 ${index}/${events.length-1}　移动 ${state.moves}/${2**diskCount-1}　当前深度 ${state.frames.length}　最大深度 ${state.maxDepth}`;
    nextBtn.disabled=index>=events.length-1; countEl.disabled=index>0;
    if(nextBtn.disabled)stopAuto();
  }
  function next(){if(index<events.length-1){index++;render()}}
  function startAuto(){if(timer||nextBtn.disabled)return;autoBtn.textContent='暂停';timer=setInterval(next,700)}
  function stopAuto(){if(timer)clearInterval(timer);timer=null;autoBtn.textContent='自动播放'}
  function reset(){stopAuto();diskCount=Number(countEl.value);events=buildTrace(diskCount);index=0;countEl.disabled=false;render()}
  nextBtn.addEventListener('click',next);autoBtn.addEventListener('click',()=>timer?stopAuto():startAuto());document.getElementById('reset').addEventListener('click',reset);countEl.addEventListener('change',reset);reset();
</script>
</body>
</html>
