<script id="greedy-model">
'use strict';
// 每一帧是独立快照。算法先生成轨迹，页面再同步呈现选择、距离和伪代码。
const COIN_PRESETS = {
  stamps:{name:'课件邮票 · 凑 140',faces:[100,70,34,21,10,1],target:140},
  small:{name:'小反例 · 1、3、4 凑 6',faces:[4,3,1],target:6}
};
const ACTIVITIES = [
  {id:'A',start:0,end:10},{id:'B',start:1,end:4},{id:'C',start:3,end:5},
  {id:'D',start:4,end:8},{id:'E',start:8,end:10},{id:'F',start:1,end:9}
];
const VERTICES = ['s','b','c','d','e','t'];
const BASE_EDGES = [['s','b',5],['s','c',6],['b','c',4],['b','d',7],['c','d',1],['d','e',2],['d','t',9],['e','t',3]];
function snapshot(states, value) {
  // structuredClone 保留 Infinity，不能用 JSON 往返复制距离。
  states.push(structuredClone(value));
}
function minimumCoins(faces, target) {
  if (!Number.isInteger(target)||target<0||faces.some(x=>!Number.isInteger(x)||x<=0)) throw new Error('面额须为正整数，目标须为非负整数');
  const counts=Array(target+1).fill(Infinity), last=Array(target+1).fill(null);counts[0]=0;
  for(let amount=1;amount<=target;amount++) for(const face of faces) {
    if(face<=amount&&counts[amount-face]+1<counts[amount]){counts[amount]=counts[amount-face]+1;last[amount]=face;}
  }
  const chosen=[];
  if(Number.isFinite(counts[target])) for(let amount=target;amount>0;amount-=last[amount]) chosen.push(last[amount]);
  return {count:counts[target],chosen};
}
function coinTrace(faces, target) {
  const ordered=[...faces].sort((a,b)=>b-a), states=[], chosen=[];let remaining=target;
  const optimum=minimumCoins(ordered,target);
  const emit=(kind,text,line,extra={})=>snapshot(states,{kind,text,line,remaining,chosen,focus:null,checkpoint:false,...extra});
  emit('准备',`目标 ${target}，每步选择不超过余量的最大面额。`,0);
  while(remaining>0) {
    const face=ordered.find(x=>x<=remaining);
    if(face===undefined){emit('无法继续','所有面额都大于余量，当前贪心路线无法凑齐目标。',1);break;}
    emit('检查候选',`余量 ${remaining}，当前最大可用面额是 ${face}。下一步取它。`,1,{focus:face,checkpoint:chosen.length===1});
    chosen.push(face);remaining-=face;
    emit('作出选择',`取 ${face}，余量变成 ${remaining}。已选 ${chosen.length} 张。`,2,{focus:face});
  }
  emit('结果',remaining===0?`贪心得到 ${chosen.length} 张。用一个更好的可行解检验这条规则。`:'贪心没有找到可行解。',3);
  return {states,optimum,faces:ordered,target};
}
function compatible(a,b){return a.end<=b.start||b.end<=a.start;}
function bestActivities(activities) {
  let best=[];
  for(let mask=0;mask<2**activities.length;mask++) {
    const subset=activities.filter((_,i)=>mask&(2**i));
    if(subset.length<=best.length)continue;
    if(subset.every((a,i)=>subset.slice(i+1).every(b=>compatible(a,b))))best=subset;
  }
  return [...best].sort((a,b)=>a.start-b.start).map(a=>a.id);
}
function activityTrace(activities,rule) {
  const key=rule==='finish'?a=>a.end:rule==='start'?a=>a.start:a=>a.end-a.start;
  const order=[...activities].sort((a,b)=>key(a)-key(b)||a.start-b.start||a.id.localeCompare(b.id));
  const states=[],chosen=[],rejected=[];let inspected=[];
  const emit=(kind,text,line,extra={})=>snapshot(states,{kind,text,line,chosen,rejected,inspected,focus:null,checkpoint:false,...extra});
  emit('准备','按选定规则排列候选活动，逐一检查是否与已选活动冲突。',0);
  for(const activity of order) {
    emit('检查候选',`检查 ${activity.id} [${activity.start}, ${activity.end})：是否与已选活动重叠？`,1,{focus:activity.id,checkpoint:inspected.length===1});
    const conflicts=activities.filter(a=>chosen.includes(a.id)&&!compatible(a,activity));
    inspected=[...inspected,activity.id];
    if(conflicts.length){rejected.push(activity.id);emit('拒绝冲突',`${activity.id} 与已选 ${conflicts.map(a=>a.id).join('、')} 重叠，跳过。`,3,{focus:activity.id});}
    else {chosen.push(activity.id);emit('作出选择',`${activity.id} 与已选活动均兼容，接受。已选 ${chosen.length} 个活动。`,2,{focus:activity.id});}
  }
  emit('结果',`本策略选中 ${chosen.join('、')}，共 ${chosen.length} 个活动。`,4);
  return {states,order,optimum:bestActivities(activities),activities:structuredClone(activities),rule};
}
function graphEdges(weight=1){return BASE_EDGES.map(([a,b,w])=>[a,b,a==='c'&&b==='d'?weight:w]);}
// 每个未确定顶点只保留一个队列项；距离改善时原位 decrease-key。
// 二叉最小堆用位置表定位顶点，距离相同按原顶点顺序决定先后。
class MinPriorityQueue {
  constructor(vertices) {
    this.rank=new Map(vertices.map((v,i)=>[v,i]));
    this.heap=vertices.map(vertex=>({vertex,priority:Infinity}));
    this.position=new Map(vertices.map((v,i)=>[v,i]));
  }
  less(a,b){return a.priority<b.priority||(a.priority===b.priority&&this.rank.get(a.vertex)<this.rank.get(b.vertex));}
  swap(i,j){[this.heap[i],this.heap[j]]=[this.heap[j],this.heap[i]];this.position.set(this.heap[i].vertex,i);this.position.set(this.heap[j].vertex,j);}
  up(i){while(i>0){const parent=Math.floor((i-1)/2);if(!this.less(this.heap[i],this.heap[parent]))break;this.swap(i,parent);i=parent;}}
  down(i){while(true){let smallest=i;for(const child of [2*i+1,2*i+2])if(child<this.heap.length&&this.less(this.heap[child],this.heap[smallest]))smallest=child;if(smallest===i)break;this.swap(i,smallest);i=smallest;}}
  peek(){return this.heap[0]||null;}
  decreaseKey(vertex,priority) {
    const i=this.position.get(vertex);
    if(i===undefined||!Number.isFinite(priority)||priority>this.heap[i].priority)throw new Error('decrease-key 要求顶点在队列中且新键不增大');
    this.heap[i].priority=priority;this.up(i);
  }
  extractMin() {
    if(!this.heap.length)return null;
    const minimum=this.heap[0],last=this.heap.pop();this.position.delete(minimum.vertex);
    if(this.heap.length){this.heap[0]=last;this.position.set(last.vertex,0);this.down(0);}
    return minimum;
  }
  ordered(){return [...this.heap].sort((a,b)=>this.less(a,b)?-1:this.less(b,a)?1:0);}
}
function dijkstraTrace(vertices, edges, source, target) {
  if(!vertices.includes(source)||!vertices.includes(target)||edges.some(([a,b,w])=>!vertices.includes(a)||!vertices.includes(b)||!Number.isFinite(w)||w<0))throw new Error('Dijkstra 要求顶点存在且边权非负');
  const distance=Object.fromEntries(vertices.map(v=>[v,Infinity])),parent=Object.fromEntries(vertices.map(v=>[v,null]));
  const states=[],done=[],queue=new MinPriorityQueue(vertices);distance[source]=0;queue.decreaseKey(source,0);
  const emit=(kind,text,line,extra={})=>snapshot(states,{kind,text,line,distance,parent,done,candidates:queue.ordered().map(entry=>entry.vertex),priorityQueue:queue.ordered(),heap:queue.heap,focus:null,edge:null,changed:null,checkpoint:false,...extra});
  emit('初始化优先队列',`Q 保存（顶点，暂定距离）。${source} 的键为 0，其余为 ∞；键越小越优先。`,0);
  while(queue.peek()) {
    const u=queue.peek().vertex;
    if(!Number.isFinite(distance[u]))break;
    emit('查看最小键 / peek',`Q 的最小项是（${u}, ${distance[u]}）。下一步从优先队列取出它。`,1,{focus:u,checkpoint:done.length===2});
    queue.extractMin();done.push(u);
    emit('确定距离',`extract-min 取出（${u}, ${distance[u]}），确定 ${u} 的距离并加入 S。`,2,{focus:u});
    for(const [a,v,w] of edges.filter(e=>e[0]===u)) {
      if(done.includes(v)){emit('邻点已确定',`${v} 已确定，无须更新。`,3,{focus:u,edge:[a,v]});continue;}
      const candidate=distance[u]+w,old=distance[v];
      emit('检查出边',`经 ${u} 到 ${v}：${distance[u]} + ${w} = ${candidate}；当前 d(${v}) = ${Number.isFinite(old)?old:'∞'}。`,3,{focus:u,edge:[a,v],checkpoint:u==='c'&&v==='d'});
      if(candidate<old) {
        distance[v]=candidate;parent[v]=u;queue.decreaseKey(v,candidate);
        emit('松弛 / 更新',`d(${v})：${Number.isFinite(old)?old:'∞'} → ${candidate}；前驱改为 ${u}。decrease-key 同步降低队列中 ${v} 的键，${v} 尚未出队。`,4,{focus:u,edge:[a,v],changed:v});
      } else emit('保持距离',`经 ${u} 的路线不更短，d(${v}) 保持 ${distance[v]}。`,4,{focus:u,edge:[a,v]});
    }
  }
  const path=[];
  if(Number.isFinite(distance[target]))for(let v=target;v!==null;v=parent[v])path.unshift(v);
  emit('结果',path.length?`最短路 ${path.join(' → ')}，总长度 ${distance[target]}。`:`从 ${source} 无法到达 ${target}，距离保持 ∞。`,5);
  return {states,vertices:[...vertices],edges:structuredClone(edges),path,source,target};
}
</script>
<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const TITLES={coins:['取最大面额，真的最省吗？','目标：张数最少 · 各面额数量无限 · 每张不可拆分','余量与已选张数'],schedule:['一台仪器，能安排多少个预约？','目标：活动数量最多 · 区间 [开始, 结束) · 首尾相接允许','已选活动与候选顺序'],dijkstra:['从 s 到 t，哪条路线最短？','课件有向图 · 箭头表示方向 · 边权非负，可相加','暂定距离与已确定集合']};
const RULE_NAMES={finish:'最早结束',start:'最早开始',duration:'最短时长'};
const CODES={coins:['按面额从大到小排列；余量 = 目标','只要余量 > 0：找不超过余量的最大面额','  选它；余量 -= 面额；张数 += 1','返回已选面额；另用更优可行解检验'],schedule:['按选择规则排序候选活动','逐一检查：是否与已选活动兼容？','  兼容：加入已选集合','  冲突：跳过这个活动','返回已选集合；核对数量'],dijkstra:['初始化 d 与 S；Q 中每项为（顶点, d）','查看 Q 的最小键：距离越小越优先','  u = Q.extractMin()；确定 u 并加入 S','  对 u 的每条出边 u → v 检查：','    更短：更新距离、前驱；Q.decreaseKey(v, d[v])','返回距离；沿前驱还原最短路径']};
const POS={s:[60,72],b:[250,72],c:[60,244],d:[250,244],e:[465,72],t:[465,244]};
let mode=['coins','schedule','dijkstra'].includes(location.hash.slice(1))?location.hash.slice(1):'coins';
let preset='stamps',activityRule='finish',weight=1,trace,index=0,timer=null,revealed=false,autoPaused=false;
const finite=value=>Number.isFinite(value)?value:'∞';
function svg(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e;}
function stop(){clearTimeout(timer);timer=null;$('play').textContent='播放';}
function rebuild(){stop();index=0;revealed=false;autoPaused=false;trace=mode==='coins'?coinTrace(COIN_PRESETS[preset].faces,COIN_PRESETS[preset].target):mode==='schedule'?activityTrace(ACTIVITIES,activityRule):dijkstraTrace(VERTICES,graphEdges(weight),'s','t');render();}
function settings(){
  $('settings').replaceChildren();
  if(mode==='dijkstra'){
    const label=document.createElement('label');label.textContent='改变 c → d 的边权：';
    const input=document.createElement('input');input.type='range';input.min=0;input.max=12;input.step=1;input.value=weight;input.id='edge-weight';input.setAttribute('aria-label','c 到 d 的边权');
    const output=document.createElement('output');output.id='weight-value';output.textContent=weight;
    input.oninput=()=>{weight=Number(input.value);output.textContent=weight;rebuild();};label.append(input,output);$('settings').append(label);
    const note=document.createElement('span');note.textContent='修改即重置 · 试试 1 与 10，预测路线怎样改变';$('settings').append(note);
    const bridge=document.createElement('p');bridge.className='small';bridge.style.width='100%';bridge.style.margin='0';
    bridge.append('BFS：普通队列按入队先后处理；Dijkstra：优先队列按暂定距离处理。');
    const link=document.createElement('a');link.href='graph_search.html#bfs';link.textContent='回看 BFS 队列 ↗';bridge.append(' ',link);$('settings').append(bridge);
  }else{
    const label=document.createElement('label');label.textContent=mode==='coins'?'例子：':'选择规则：';
    const select=document.createElement('select');select.id=mode==='coins'?'coin-preset':'activity-rule';
    for(const [value,name] of Object.entries(mode==='coins'?Object.fromEntries(Object.entries(COIN_PRESETS).map(([k,v])=>[k,v.name])):RULE_NAMES)){
      const option=document.createElement('option');option.value=value;option.textContent=name;option.selected=value===(mode==='coins'?preset:activityRule);select.append(option);
    }
    select.onchange=()=>{if(mode==='coins')preset=select.value;else activityRule=select.value;rebuild();};label.append(select);$('settings').append(label);
    const note=document.createElement('span');note.textContent=mode==='coins'?'每一步只看当前余量；暂不回头改选':'改变规则后，用同一组活动比较结果';$('settings').append(note);
  }
}
function metrics(pairs){return '<div class="metrics">'+pairs.map(([name,value])=>`<div class="metric"><span>${name}</span><strong>${value}</strong></div>`).join('')+'</div>';}
function drawCoins(s){
  $('visual').innerHTML=`<div class="coin-bank">${trace.faces.map(face=>`<div class="coin-item"><div class="coin ${face===s.focus?'active':face>s.remaining?'unavailable':''}">${face}</div><span>${face===s.focus&&s.kind==='作出选择'?'本步已选':face>s.remaining?'大于余量':'可用'}</span></div>`).join('')}</div><h3>已选面额</h3><div class="chosen-coins">${s.chosen.map(face=>`<span class="chip accepted">${face}</span>`).join('')||'<span class="empty">还没有选择</span>'}</div><div class="amount-line"><div class="amount-fill" style="width:${100*(trace.target-s.remaining)/trace.target}%"></div></div><div class="amount-caption"><span>已凑 ${trace.target-s.remaining}</span><span>目标 ${trace.target}</span></div>`;
  $('state').innerHTML=metrics([['当前余量',s.remaining],['已选张数',s.chosen.length]])+'<h3>当前可用面额 · 从大到小</h3><div class="state-list">'+trace.faces.filter(face=>face<=s.remaining).map(face=>`<span class="chip ${face===s.focus?'current':''}">${face}</span>`).join('')+(s.remaining===0?'<span class="empty">目标已凑齐</span>':'')+'</div>';
}
function drawActivities(s){
  const drawing=svg('svg',{viewBox:'0 0 560 300',class:'diagram',role:'img','aria-label':'六个活动的时间区间；橙色为当前检查，绿色已选，红色拒绝'});
  const x=time=>60+time*46;
  for(let t=0;t<=10;t++){drawing.append(svg('line',{x1:x(t),x2:x(t),y1:22,y2:268,class:'axis',opacity:t%2?'.18':'.4'}),svg('text',{x:x(t),y:289,'text-anchor':'middle',class:'tick'},t));}
  ACTIVITIES.forEach((a,i)=>{
    const y=25+i*40,status=a.id===s.focus?'current':s.chosen.includes(a.id)?'accepted':s.rejected.includes(a.id)?'rejected':'';
    drawing.append(svg('text',{x:25,y:y+21,class:'activity-label'},a.id),svg('rect',{x:x(a.start),y,width:(a.end-a.start)*46,height:29,rx:5,class:'activity '+status}),svg('text',{x:(x(a.start)+x(a.end))/2,y:y+20,'text-anchor':'middle',class:'activity-label'},`${a.start}–${a.end}`));
    if(s.rejected.includes(a.id))drawing.append(svg('text',{x:542,y:y+22,'text-anchor':'end',class:'tick'},'×'));
  });
  $('visual').replaceChildren(drawing);
  $('state').innerHTML=metrics([['已选活动',s.chosen.length],['已检查',s.inspected.length+' / '+ACTIVITIES.length]])+'<h3>候选顺序 · '+RULE_NAMES[activityRule]+'</h3><div class="state-list">'+trace.order.map(a=>`<span class="chip ${a.id===s.focus?'current':s.chosen.includes(a.id)?'accepted':s.rejected.includes(a.id)?'rejected':''}">${a.id} · ${activityRule==='duration'?a.end-a.start:activityRule==='start'?a.start:a.end}</span>`).join('')+'</div><p class="small">已选集合：'+(s.chosen.join('、')||'∅')+'。判断兼容时检查所有已选活动；首尾相接不算重叠。</p>';
}
function drawGraph(s){
  const drawing=svg('svg',{viewBox:'0 0 560 315',class:'diagram',role:'img','aria-label':'Dijkstra 有向图，边权与课件一致，节点旁显示暂定距离'}),defs=svg('defs');
  for(const [name,color] of [['base','#becad7'],['tree','#18724d'],['focus','#b7500a'],['path','#064996']]){const m=svg('marker',{id:'arrow-'+name,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:5,markerHeight:5,orient:'auto'});m.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:color}));defs.append(m);}drawing.append(defs);
  for(const [a,b,w] of trace.edges){
    const [x1,y1]=POS[a],[x2,y2]=POS[b],dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
    const inPath=index===trace.states.length-1&&trace.path.some((v,i)=>v===a&&trace.path[i+1]===b),focus=s.edge&&s.edge[0]===a&&s.edge[1]===b;
    const type=inPath?'path':focus?'focus':s.parent[b]===a?'tree':'base';
    drawing.append(svg('line',{x1:x1+ux*24,y1:y1+uy*24,x2:x2-ux*29,y2:y2-uy*29,class:'edge '+type,'marker-end':'url(#arrow-'+type+')'}));
    drawing.append(svg('text',{x:(x1+x2)/2-uy*16,y:(y1+y2)/2+ux*16-3,'text-anchor':'middle',class:'weight'},w));
  }
  for(const v of VERTICES){const [x,y]=POS[v],g=svg('g',{transform:`translate(${x},${y})`,class:'vertex '+(s.focus===v?'current':s.done.includes(v)?'done':'')});g.append(svg('circle',{r:23}),svg('text',{'text-anchor':'middle',dy:7},v),svg('text',{'text-anchor':'middle',y:45,class:'distance'},`d = ${finite(s.distance[v])}${s.done.includes(v)?' ✓':''}`));drawing.append(g);}
  $('visual').replaceChildren(drawing);
  const cellClass=v=>s.focus===v?'current':s.done.includes(v)?'done':'';
  $('state').innerHTML='<div class="table-wrap"><table><caption class="small">d(v)：从 s 到 v 的当前最好距离</caption><thead><tr><th>顶点</th>'+VERTICES.map(v=>`<th class="${cellClass(v)}">${v}</th>`).join('')+'</tr></thead><tbody><tr><th>距离</th>'+VERTICES.map(v=>`<td class="${s.changed===v?'changed':cellClass(v)}">${finite(s.distance[v])}</td>`).join('')+'</tr><tr><th>前驱</th>'+VERTICES.map(v=>`<td class="${cellClass(v)}">${s.parent[v]||'—'}</td>`).join('')+'</tr><tr><th>状态</th>'+VERTICES.map(v=>`<td class="${cellClass(v)}">${s.done.includes(v)?'确定':'暂定'}</td>`).join('')+'</tr></tbody></table></div><h3>优先队列 Q · 最小距离优先</h3><div class="state-list" aria-label="优先队列，按键从小到大展示">'+s.priorityQueue.map((entry,i)=>`<span class="chip ${i===0?'current':''}">(${entry.vertex}, ${finite(entry.priority)})</span>`).join('')+(s.priorityQueue.length?'':'<span class="empty">优先队列为空</span>')+'</div><p class="small">每格记录（顶点，暂定距离），最小键在左。按优先级排序展示，底层用二叉最小堆。S = {'+s.done.join(', ')+'}。</p>';
}
function comparison(){
  const final=trace.states.at(-1);
  if(mode==='coins')return `<strong>贪心：${final.chosen.join(' + ')}，${final.chosen.length} 张</strong><p>最少张数：${trace.optimum.chosen.join(' + ')}，${trace.optimum.count} 张。</p><p>最大面额优先只顾当前余量；换一种面额系统，就可能失去最优保证。</p>`;
  if(mode==='schedule')return `<strong>${RULE_NAMES[activityRule]}：${final.chosen.join('、')}，${final.chosen.length} 个</strong><p>最多可安排 ${trace.optimum.length} 个，例如 ${trace.optimum.join('、')}。</p><p>${activityRule==='finish'?'最早结束给后续活动留下最多时间。把某个最优安排的首项换成最早结束的活动，不会妨碍后面的安排。':'这组活动就是该规则的反例。切换到“最早结束”，在相同输入上比较。'} 此结论的目标是活动数量最多。</p>`;
  return `<strong>${trace.path.join(' → ')}，总长度 ${final.distance.t}</strong><p>已确定顺序：${final.done.join(' → ')}。</p><p>因为边权非负，后续绕经其他顶点不会让已选最小距离变得更短。暂定距离可以变，已确定距离可安全固定。</p>`;
}
function question(s){
  if(mode==='coins')return s.kind==='结果'?['哪个选择把贪心引向了更差的结果？','揭示结果对照，比较两种方案的第一张，指出局部规则忽略了什么。']:['余量 '+s.remaining+' 时，下一张按规则应该取多少？','先说出“最大且不超过余量”的面额，再预测能否得到最少张数。'];
  if(mode==='schedule')return s.kind==='结果'?['换一个选择规则，结果会变吗？','保持活动不变，比较最早开始、最短时长与最早结束。']:s.kind==='检查候选'?['活动 '+s.focus+' 能接受吗？它和谁冲突？','指出区间是否重叠；结束时刻等于下一个开始时刻是允许的。']:['按“'+RULE_NAMES[activityRule]+'”，下一项检查谁？','按当前规则确定候选，再核对它是否与已选集合兼容。'];
  if(s.kind==='检查出边')return ['这条出边会让邻点的暂定距离变小吗？','比较 d(u) + 边权 与 d(v)；更新距离不等于确定距离。'];
  if(s.kind==='结果')return ['如果只选最近的一条边，会得到同一路线吗？','Dijkstra 比较的是从源点累积的暂定距离；改变 c → d 边权，再预测路线。'];
  return ['下一轮该确定哪个顶点？为什么？','看优先队列的最小键：每项的优先级是从源点累计的暂定距离。'];
}
function render(){
  const s=trace.states[index],[title,subtitle,stateTitle]=TITLES[mode];
  for(const name of Object.keys(TITLES))$(name).setAttribute('aria-pressed',mode===name);
  $('visual-title').textContent=title;$('visual-subtitle').textContent=subtitle;$('state-title').textContent=stateTitle;
  $('step-count').textContent=`${index} / ${trace.states.length-1} 步`;$('progress').max=trace.states.length-1;$('progress').value=index;
  $('prev').disabled=index===0;$('next').disabled=index===trace.states.length-1;$('play').disabled=index===trace.states.length-1;
  $('rule').textContent=mode==='coins'?'选择规则：每次取不超过余量的最大面额。':mode==='schedule'?'选择规则：'+RULE_NAMES[activityRule]+'优先；有冲突就跳过。':'用优先队列取出暂定距离最小的顶点；松弛成功时同步降低邻点的键。';
  if(mode==='coins')drawCoins(s);else if(mode==='schedule')drawActivities(s);else drawGraph(s);
  $('legend').innerHTML=mode==='coins'?'<span><i class="dot orange"></i>当前选择</span><span><i class="dot green"></i>已选</span>':mode==='schedule'?'<span><i class="dot"></i>未检查</span><span><i class="dot orange"></i>当前检查</span><span><i class="dot green"></i>已选</span><span><i class="dot red"></i>已拒绝</span>':'<span><i class="dot"></i>未确定</span><span><i class="dot orange"></i>当前顶点／出边</span><span><i class="dot green"></i>已确定／前驱边</span>';
  $('event-label').textContent=s.kind;$('action-text').textContent=s.text;
  $('comparison').hidden=!revealed;$('comparison').innerHTML=comparison();$('reveal').setAttribute('aria-expanded',revealed);$('reveal').textContent=revealed?'收起结果对照':'揭示结果对照';
  $('code').replaceChildren(...CODES[mode].map((text,i)=>{const li=document.createElement('li');li.textContent=text;if(s.line===i)li.className='active';return li;}));
  const [prompt,hint]=question(s);$('question').textContent=prompt;$('hint').textContent=hint;
  $('question-title').textContent=s.checkpoint?'停一下 · 先预测':'先预测，再运行';$('prediction-panel').classList.toggle('checkpoint',s.checkpoint);
  $('pause-note').textContent=autoPaused?'已暂停，留出思考时间。点击“下一步”或“播放”继续。':'';
}
function tick(){timer=null;if(index>=trace.states.length-1){stop();return;}index++;autoPaused=false;render();if(trace.states[index].checkpoint){stop();autoPaused=true;render();return;}if(index===trace.states.length-1){stop();return;}timer=setTimeout(tick,Number($('speed').value));}
$('play').onclick=()=>{if(timer!==null){stop();return;}autoPaused=false;$('play').textContent='暂停';timer=setTimeout(tick,Number($('speed').value));render();};
for(const [id,delta] of [['prev',-1],['next',1]])$(id).onclick=()=>{stop();autoPaused=false;index=Math.max(0,Math.min(trace.states.length-1,index+delta));render();};
$('reset').onclick=rebuild;$('progress').oninput=()=>{stop();autoPaused=false;index=Number($('progress').value);render();};
$('reveal').onclick=()=>{revealed=!revealed;render();};
for(const name of Object.keys(TITLES))$(name).onclick=()=>{if(mode===name)return;mode=name;history.replaceState(null,'','#'+name);settings();rebuild();};
window.addEventListener('hashchange',()=>{const name=location.hash.slice(1);if(Object.keys(TITLES).includes(name)&&mode!==name){mode=name;settings();rebuild();}});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('fullscreen').textContent='请用浏览器全屏';}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏';});
settings();rebuild();
</script>
