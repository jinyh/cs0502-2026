<script id="routing-model">
'use strict';
function createPacketRoutingModel(name='basic'){
 const expanded=name==='expanded';
 if(!['basic','expanded'].includes(name))throw Error('未知网络');
 const root=expanded?'N7':'N4';
 const routers=expanded?['N1','N2','N3','N4','N5','N6','N7']:['N1','N2','N3','N4'];
 const links=expanded?[['N1','N2'],['N1','N3'],['N2','N3'],['N2','N4'],['N2','N5'],['N3','N5'],['N4','N5'],['N4','N6'],['N4','N7'],['N5','N6'],['N5','N7'],['N6','N7']]:[['N1','N2'],['N1','N3'],['N2','N3'],['N2','N4']];
 const delays=expanded?{N1:4,N2:6,N3:8,N4:3,N5:5,N6:7,N7:2}:{N1:4,N2:6,N3:8,N4:2};
 const given=expanded?{N1:'N3',N2:'N5',N3:'N2',N4:'N6',N5:'N4',N6:'N7',N7:'T'}:{N1:'N3',N2:'N4',N3:'N2',N4:'T'};
 const neighbors=n=>links.flatMap(([a,b])=>a===n?[b]:b===n?[a]:[]).sort();
 const clone=v=>JSON.parse(JSON.stringify(v));
 function forwarding(table){
  for(const n of routers)if(!(n in table)||!(n===root?table[n]==='T':neighbors(n).includes(table[n])))throw Error('下一跳必须相邻，目的端路由器交给T');
  const frames=[],f={kind:'forward',phase:'initial',at:'S',path:['S'],edge:null,next:null,matched:false,elapsed:0,hops:0,checkpoint:false,done:false,message:'分组在传感器 S，目的地是 T。'};
  const push=(phase,message,extra={})=>{Object.assign(f,{phase,message,edge:null,checkpoint:false,matched:false,next:null,tableOwner:null},extra);frames.push(clone(f));};
  push('initial',f.message);
  push('send','S 将分组交给接入路由器 N1。',{at:'N1',edge:['S','N1']});
  let current='N1',visited=new Set();
  while(current!=='T'){
   if(visited.has(current))throw Error('转发表形成环路');visited.add(current);
   f.path.push(current);
   push('arrive',`分组到达 ${current}。先看目的地，再查本地表。`,{at:current,checkpoint:current==='N1'});
   push('read',`${current} 读取分组头：目的地是 T。`);
   f.elapsed+=delays[current];
   const next=table[current];
   push('lookup',`命中 ${current} 的“目的地 T”表项。本节点处理计 ${delays[current]} ms。`,{matched:true,next});
   push('choose',`${current} 选择下一跳 ${next}，最终目的地仍为 T。`,{matched:true,next});
   if(next!=='T')f.hops++;
   push('send',`沿 ${current}—${next} 发送；动画速度不代表实际耗时。`,{at:next,edge:[current,next],next,matched:true,tableOwner:current});
   current=next;
  }
  f.path.push('T');
  push('done','T 收到分组。沿途每台路由器都只按本地表决定下一跳。',{at:'T',done:true});
  return frames;
 }
 function routing(){
  const frames=[],f={kind:'routing',phase:'initial',dist:Object.fromEntries(routers.map(n=>[n,n===root?0:null])),prev:Object.fromEntries(routers.map(n=>[n,null])),settled:[],current:null,edge:null,checkpoint:false,done:false,message:`从 T 接入的 ${root} 出发。每条路由器间链路代价为 1。`};
  const push=(phase,message,extra={})=>{Object.assign(f,{phase,message,edge:null,checkpoint:false},extra);frames.push(clone(f));};
  push('initial',f.message);
  while(f.settled.length<routers.length){
   const u=routers.filter(n=>!f.settled.includes(n)&&f.dist[n]!==null).sort((a,b)=>f.dist[a]-f.dist[b]||a.localeCompare(b))[0];
   if(!u)break;
   push('candidate',`候选中取距离最小的节点。同距时按名称排序。`,{current:null,checkpoint:true});
   f.settled.push(u);push('settle',`确定 ${u}：到 ${root} 的最少跳数为 ${f.dist[u]}。`,{current:u});
   for(const v of neighbors(u)){
    if(f.settled.includes(v)){push('skip',`${v} 已确定，不再更新。`,{edge:[u,v]});continue;}
    push('compare',`比较 ${v}：经 ${u} 的候选距离 = ${f.dist[u]} + 1 = ${f.dist[u]+1}，原距离 ${f.dist[v]===null?'∞':f.dist[v]}。`,{edge:[u,v],checkpoint:true});
    const better=f.dist[v]===null||f.dist[u]+1<f.dist[v];
    if(better){f.dist[v]=f.dist[u]+1;f.prev[v]=u;}
    push('relax',better?`更新 ${v}：距离 ${f.dist[v]}，前驱 ${u}。`:`${v} 的距离不变，保留已有前驱。${f.dist[u]+1===f.dist[v]?' 发现等长备选路径；本演示保留先找到的一条。':''}`,{edge:[u,v]});
   }
  }
  push('tree',`最短路树已完成。从各节点沿前驱走向 ${root}，可得到到 T 的下一跳。`);
  f.table=Object.fromEntries(routers.map(n=>[n,n===root?'T':f.prev[n]]));
  push('done','到 T 的新表已生成。请主动进入“③ 按新表转发”。',{done:true});
  return frames;
 }
 const routeFrames=routing(),newTable=clone(routeFrames.at(-1).table);
 const stageFrames={given:forwarding(given),routing:routeFrames,new:forwarding(newTable)};
 function createState(){return{stage:'given',index:0,routeReady:false,completed:{}};}
 function frame(s){return stageFrames[s.stage][s.index];}
 function act(state,action){
  const s=clone(state),fs=stageFrames[s.stage];
  if(action.type==='stage'){
   if(!stageFrames[action.stage]||(action.stage==='new'&&!s.routeReady))return s;
   s.stage=action.stage;s.index=0;delete s.completed[s.stage];
   if(s.stage==='routing'){s.routeReady=false;delete s.completed.new;}
  }else if(action.type==='next'){s.index=Math.min(s.index+1,fs.length-1);
  }else if(action.type==='back'){s.index=Math.max(s.index-1,0);
  }else if(action.type==='reset'){s.index=0;delete s.completed[s.stage];if(s.stage==='routing'){s.routeReady=false;delete s.completed.new;}}
  else throw Error('未知操作');
  if(frame(s).done){s.completed[s.stage]=true;if(s.stage==='routing')s.routeReady=true;}
  else{delete s.completed[s.stage];if(s.stage==='routing')s.routeReady=false;}
  return s;
 }
 return{name,root,routers,links,delays,given,newTable,neighbors,forwarding,routing,stageFrames,createState,frame,act};
}
const PacketRoutingModel=Object.assign(createPacketRoutingModel(),{create:createPacketRoutingModel});
</script>
<script>
'use strict';
let M=PacketRoutingModel.create('expanded');
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
let state=M.createState(),playing=false,timer=null,motion=null;
if(location.protocol!=='file:'&&location.pathname.includes('/cs0502-2026/'))document.querySelector('footer a').setAttribute('href','packet_routing-guide/');
let pos={S:[65,210],N1:[225,210],N2:[425,210],N3:[325,75],N4:[590,210],T:[700,210]};
function svg(tag,attrs,text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e;}
const key=([a,b])=>[a,b].sort().join('-');
let edgeEls={},nodeEls={};
function buildGraph(){
 document.documentElement.dataset.network=M.name;
 pos=M.name==='expanded'?{S:[55,180],N1:[170,180],N2:[305,70],N3:[305,265],N4:[455,65],N5:[455,250],N6:[580,300],N7:[620,150],T:[715,150]}:{S:[65,210],N1:[225,210],N2:[425,210],N3:[325,75],N4:[590,210],T:[700,210]};
 $('edges').replaceChildren();$('nodes').replaceChildren();edgeEls={};nodeEls={};
 $('graphTitle').textContent=M.name==='expanded'?'七路由器多路径网络':'四路由器课件网络';
 $('graphDesc').textContent=`S接入N1，T接入${M.root}。路由器链路：${M.links.map(e=>e.join('—')).join('，')}。线条交叉处没有节点即不相连。`;
for(const [a,b]of [['S','N1'],...M.links,[M.root,'T']]){
 const [x1,y1]=pos[a],[x2,y2]=pos[b];const line=svg('line',{x1,y1,x2,y2,class:'edge'});edgeEls[key([a,b])]=line;$('edges').append(line);
 if(M.routers.includes(a)&&M.routers.includes(b))$('edges').append(svg('text',{x:(x1+x2)/2+(a==='N1'&&b==='N3'?-32:a==='N1'&&b==='N2'?0:9),y:(y1+y2)/2-10,class:'edgeLabel'},'1'));
}

for(const [n,[x,y]]of Object.entries(pos)){
 const g=svg('g',{class:'node',transform:`translate(${x},${y})`});nodeEls[n]=g;
 g.append(M.routers.includes(n)?svg('circle',{r:32}):svg('rect',{x:-28,y:-25,width:56,height:50,rx:4}));g.append(svg('text',{y:9},n));
 g.append(svg('text',{y:57,class:'delay'},M.delays[n]?`处理 ${M.delays[n]} ms`:n==='S'?'传感器':'接收主机'));$('nodes').append(g);
}
}
buildGraph();
$('topology').onchange=()=>{pause();motion?.cancel();M=PacketRoutingModel.create($('topology').value);state=M.createState();buildGraph();draw();};
function row(values,hit=false){const tr=document.createElement('tr');if(hit)tr.className='hit';for(const val of values){const td=document.createElement('td');td.textContent=val;tr.append(td);}return tr;}
function header(values){$('tableHead').replaceChildren();const tr=document.createElement('tr');for(const val of values){const th=document.createElement('th');th.scope='col';th.textContent=val;tr.append(th);}$('tableHead').append(tr);}
function draw(animate=false,previous=null){
 const f=M.frame(state),isRoute=state.stage==='routing',at=isRoute?f.current:f.at;
 for(const [n,g]of Object.entries(nodeEls))g.setAttribute('class','node'+(n===at?' current':'')+(isRoute&&f.settled.includes(n)?' settled':'')+(isRoute&&n===M.root?' root':''));
 for(const l of Object.values(edgeEls))l.setAttribute('class','edge');
 if(!isRoute){for(let i=1;i<f.path.length;i++)edgeEls[key([f.path[i-1],f.path[i]])].classList.add('used');}
 else for(const [v,u]of Object.entries(f.prev))if(u)edgeEls[key([v,u])].classList.add('used');
 if(f.edge)edgeEls[key(f.edge)].classList.add('active');
 motion?.cancel();motion=null;$('packet').style.display=isRoute?'none':'';
 if(!isRoute){const [x,y]=pos[f.at];$('packet').setAttribute('transform',`translate(${x},${y-38})`);if(animate&&previous&&f.phase==='send'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const [px,py]=pos[previous.at];if(px!==x||py!==y)motion=$('packet').animate([{transform:`translate(${px}px,${py-38}px)`},{transform:`translate(${x}px,${y-38}px)`}],{duration:Math.min(480,Number($('speed').value)*.65),easing:'ease-in-out'});}}
 $('tableBody').replaceChildren();$('candidate').textContent='';
 if(isRoute){
  $('tableTitle').textContent=f.done?'到 T 的新转发表':'Dijkstra：距离与前驱';
  $('tableContext').textContent=`以 ${M.root} 为根，计算各路由器到 T 的最少跳数。`;
  header(f.done?['路由器','目的地','下一跳']:['节点',`到 ${M.root} 的距离`,'前驱','状态']);
  for(const n of M.routers)$('tableBody').append(row(f.done?[n,'T',f.table[n]]:[n,f.dist[n]??'∞',f.prev[n]??'—',f.settled.includes(n)?'已确定':'待确定'],n===(f.edge?f.edge[1]:f.current)));
  const candidates=M.routers.filter(n=>!f.settled.includes(n)&&f.dist[n]!==null).sort((a,b)=>f.dist[a]-f.dist[b]||a.localeCompare(b));
  $('candidate').textContent=f.done?'新表已就绪；等待教师切换到阶段③。':'候选：'+(candidates.map(n=>`${n}（${f.dist[n]}）`).join('，')||'无');
  $('phaseNote').textContent=`每条路由器间链路代价=1；不含主机接入链路。前驱指向更靠近 ${M.root} 的节点。`;
  $('trace').textContent=f.settled.length?f.settled.join(' → '):'尚未确定节点';
  $('metric').textContent='路由指标：路由器间跳数';
  $('boundary').textContent='无向教学网络上的集中计算，不模拟实际路由协议的消息交换与收敛。';
 }else{
  const owner=f.tableOwner??(M.routers.includes(f.at)?f.at:null),table=state.stage==='given'?M.given:M.newTable;
  $('tableTitle').textContent=owner?`${owner} 的本地转发表`:f.done?'已送达 T':'等待查表';
  $('tableContext').textContent=state.stage==='given'?(M.name==='basic'?'课件给定表，尚未重新计算。':'扩展教学表，故意绕行以便比较多条备选路径。'):'使用阶段②生成的新表，分组本身不运行 Dijkstra。';
  header(['目的地','下一跳','处理时延']);
  if(owner)$('tableBody').append(row(['T',table[owner],M.delays[owner]+' ms'],f.matched));else $('tableBody').append(row(['—','—','—']));
  $('candidate').textContent=f.next?`本跳选择：${f.next}；最终目的地：T`:'分组头：目的地 T';
  $('phaseNote').textContent='橙色表项表示本步已查表命中。下一跳必须是相邻节点。';
  $('trace').textContent=f.path.join(' → ');
  $('metric').replaceChildren();const strong=document.createElement('strong');strong.textContent=f.elapsed+' ms';$('metric').append('处理时延累计：',strong,`；已跨路由器链路：${f.hops} 跳`);
  $('boundary').textContent='毫秒仅累计路由器处理时延，未计发送、传播与排队时延。链路上移动的快慢仅为演示效果。';
 }
 $('comparison').textContent='';
 if(state.stage==='new'&&f.done){const old=M.stageFrames.given.at(-1);$('comparison').textContent=(state.completed.given?`给定表：${old.path.join(' → ')}，${old.hops} 跳，${old.elapsed} ms。 `:'')+`新表：${f.path.join(' → ')}，${f.hops} 跳，${f.elapsed} ms。最少跳数不保证最低实际时延。`;}
 $('message').textContent=f.message;
 $('cue').textContent=f.checkpoint?(isRoute?(f.phase==='candidate'?'先预测：候选中哪个节点应先确定？':'先预测：这条链路会让距离变小吗？'):'先预测：N1 到 T 的下一跳是哪台路由器？'):f.done?(isRoute?'点击阶段③，重新发送一个分组。':state.stage==='given'?'现在进入阶段②：转发表怎样产生？':'追问：分组自己算了最短路吗？'):'先观察当前状态，再推进一步。';
 $('next').disabled=f.done;$('back').disabled=state.index===0;$('play').disabled=f.done;$('play').textContent=playing?'Ⅱ 暂停':'▶ 播放';
 $('next').textContent=f.checkpoint?'揭示下一步 →':'下一步 →';
 $('stepCount').textContent=`步骤 ${state.index} / ${M.stageFrames[state.stage].length-1}`;
 document.querySelectorAll('[data-stage]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.stage===state.stage));b.disabled=b.dataset.stage==='new'&&!state.routeReady;});
}
function pause(){clearTimeout(timer);timer=null;playing=false;}
function dispatch(action,animate=false){const prev=M.frame(state);state=M.act(state,action);draw(animate,prev);}
function tick(){if(!playing)return;dispatch({type:'next'},true);const f=M.frame(state);if(f.done||($('checkpoints').checked&&f.checkpoint)){pause();draw();return;}timer=setTimeout(tick,Number($('speed').value));}
$('next').onclick=()=>{pause();dispatch({type:'next'},true);};$('back').onclick=()=>{pause();dispatch({type:'back'});};$('reset').onclick=()=>{pause();dispatch({type:'reset'});};
$('play').onclick=()=>{if(playing){pause();draw();}else{playing=true;draw();timer=setTimeout(tick,Number($('speed').value));}};
$('speed').onchange=()=>{if(playing){clearTimeout(timer);timer=setTimeout(tick,Number($('speed').value));}};
for(const b of document.querySelectorAll('[data-stage]'))b.onclick=()=>{pause();dispatch({type:'stage',stage:b.dataset.stage});};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('fullscreen').textContent='请使用浏览器全屏';}};
window.addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();draw();}});
const reduced=matchMedia('(prefers-reduced-motion: reduce)');reduced.addEventListener('change',()=>{motion?.cancel();motion=null;});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,summary,a')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'){e.preventDefault();$('next').click();}if(e.key==='ArrowLeft'){e.preventDefault();$('back').click();}if(e.code==='Space'&&!e.target.closest('button')){e.preventDefault();$('play').click();}});draw();
</script></body></html>
