notes:
  - 讲次编号是教学序列，卡片文件名是概念标识，两者不得按编号猜测。
  - core_cards 按建议学习顺序排列；supporting_cards 只用于补救或复习，不引入新的必备先修。
  - preview_cards 用于建立后续主题直觉；extension_cards 为选学延伸，均不计入当讲必读负担。
  - estimated_minutes 是单卡完整学习估计，不应直接相加解释为正式课时。
  - status 改为 approved 前，不宣称这是已生效的正式课表。
