<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
  <title id="t">顺序表与链表</title><desc id="d">同一线性逻辑关系的连续存储和链接存储。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#0f766e"/></marker></defs>
  <rect width="960" height="340" rx="20" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a"><text x="40" y="55" font-size="26" font-weight="700">顺序表：连续位置，按下标直接定位</text><text x="40" y="195" font-size="26" font-weight="700">链表：节点可分散，用链接保持次序</text></g>
  <g font-family="system-ui,sans-serif" text-anchor="middle" font-size="24"><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><rect x="100" y="80" width="150" height="70"/><rect x="250" y="80" width="150" height="70"/><rect x="400" y="80" width="150" height="70"/><rect x="550" y="80" width="150" height="70"/></g><text x="175" y="125">A [0]</text><text x="325" y="125">B [1]</text><text x="475" y="125">C [2]</text><text x="625" y="125">D [3]</text>
  <g fill="#ccfbf1" stroke="#0f766e" stroke-width="3"><rect x="80" y="225" width="150" height="70" rx="10"/><rect x="320" y="225" width="150" height="70" rx="10"/><rect x="560" y="225" width="150" height="70" rx="10"/><rect x="780" y="225" width="110" height="70" rx="10"/></g><text x="155" y="270">A | next</text><text x="395" y="270">B | next</text><text x="635" y="270">C | next</text><text x="835" y="270">D | ∅</text><g stroke="#0f766e" stroke-width="4" marker-end="url(#a)"><path d="M230 260L320 260"/><path d="M470 260L560 260"/><path d="M710 260L780 260"/></g></g>
</svg>
