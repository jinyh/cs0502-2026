<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">栈、队列和递归调用栈</title><desc id="d">栈后进先出，队列先进先出，递归调用保存函数帧。</desc><rect width="960" height="360" rx="20" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><text x="170" y="42" font-size="26" font-weight="700">栈 LIFO</text><text x="480" y="42" font-size="26" font-weight="700">队列 FIFO</text><text x="790" y="42" font-size="26" font-weight="700">调用栈</text>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><rect x="90" y="75" width="160" height="55"/><rect x="90" y="130" width="160" height="55"/><rect x="90" y="185" width="160" height="55"/><rect x="90" y="240" width="160" height="55"/></g><g font-size="22"><text x="170" y="110">D ← top</text><text x="170" y="165">C</text><text x="170" y="220">B</text><text x="170" y="275">A</text></g>
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="3"><rect x="330" y="145" width="100" height="70"/><rect x="430" y="145" width="100" height="70"/><rect x="530" y="145" width="100" height="70"/></g><g font-size="22"><text x="380" y="187">A</text><text x="480" y="187">B</text><text x="580" y="187">C</text><text x="330" y="245">出队 ←</text><text x="635" y="245">← 入队</text></g>
  <g fill="#fef3c7" stroke="#d97706" stroke-width="3"><rect x="710" y="90" width="170" height="55"/><rect x="710" y="145" width="170" height="55"/><rect x="710" y="200" width="170" height="55"/></g><g font-size="21"><text x="795" y="125">hanoi(1)</text><text x="795" y="180">hanoi(2)</text><text x="795" y="235">hanoi(3)</text><text x="795" y="292">返回时反向弹出</text></g></g>
</svg>
