  <g font-size="22"><text x="240" y="93">根</text><text x="150" y="178">左</text><text x="330" y="178">右</text><text x="105" y="268">叶</text><text x="195" y="268">叶</text><text x="720" y="93">2</text><text x="630" y="178">5</text><text x="810" y="178">4</text><text x="585" y="268">9</text><text x="675" y="268">7</text></g></g>
