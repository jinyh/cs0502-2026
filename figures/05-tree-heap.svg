  <title id="t">二叉树与最小堆</title><desc id="d">普通树表达层次，最小堆额外保证父节点不大于子节点。</desc><rect width="960" height="360" rx="20" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="240" y="45" font-size="26" font-weight="700">二叉树：层次关系</text><text x="720" y="45" font-size="26" font-weight="700">最小堆：父 ≤ 子</text>
  <g stroke="#64748b" stroke-width="4"><path d="M240 90L150 170M240 90L330 170M150 170L105 260M150 170L195 260"/><path d="M720 90L630 170M720 90L810 170M630 170L585 260M630 170L675 260"/></g>
