  <g fill="#ede9fe" stroke="#7c3aed" stroke-width="3"><rect x="100" y="115" width="120" height="70"/><rect x="220" y="115" width="120" height="70"/><rect x="340" y="115" width="120" height="70"/><rect x="460" y="115" width="120" height="70"/><rect x="580" y="115" width="120" height="70"/></g><g font-size="26"><text x="160" y="160">0</text><text x="280" y="160">1</text><text x="400" y="160">1</text><text x="520" y="160">0</text><text x="640" y="160">_</text></g><path d="M400 245V190" stroke="#7c3aed" stroke-width="5" marker-end="url(#a)"/><text x="400" y="282" font-size="22">读写头，状态 q</text><path d="M745 150H860" stroke="#7c3aed" stroke-width="5" marker-end="url(#a)"/><text x="805" y="120" font-size="20">写 0，右移</text><text x="805" y="195" font-size="20">进入 q′</text></g>
