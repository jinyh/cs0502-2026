<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">进程状态、互斥与死锁</title><desc id="d">进程在就绪运行阻塞间转换，锁保护临界区，反向锁顺序可形成死锁。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#334155"/></marker></defs><rect width="960" height="360" rx="20" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="250" y="40" font-size="24" font-weight="700">进程状态</text><text x="720" y="40" font-size="24" font-weight="700">循环等待导致死锁</text>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><ellipse cx="130" cy="160" rx="75" ry="42"/><ellipse cx="310" cy="90" rx="75" ry="42"/><ellipse cx="310" cy="235" rx="75" ry="42"/></g><g font-size="22"><text x="130" y="168">就绪</text><text x="310" y="98">运行</text><text x="310" y="243">阻塞</text></g><g stroke="#334155" stroke-width="4" marker-end="url(#a)"><path d="M190 135L240 112"/><path d="M270 125L185 145"/><path d="M310 132V190"/><path d="M245 225L175 188"/></g>
  <g fill="#fee2e2" stroke="#dc2626" stroke-width="3"><rect x="560" y="90" width="120" height="60" rx="10"/><rect x="760" y="210" width="120" height="60" rx="10"/><circle cx="790" cy="105" r="38"/><circle cx="650" cy="250" r="38"/></g><g font-size="21"><text x="620" y="128">进程 P</text><text x="820" y="248">进程 Q</text><text x="790" y="112">锁 A</text><text x="650" y="257">锁 B</text></g><g stroke="#dc2626" stroke-width="4" marker-end="url(#a)"><path d="M680 110L745 107"/><path d="M790 145L815 207"/><path d="M760 247L692 250"/><path d="M625 215L625 153"/></g></g>
