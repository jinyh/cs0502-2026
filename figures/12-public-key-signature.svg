<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d"><title id="t">公钥加密与数字签名</title><desc id="d">加密保护内容，签名验证来源与完整性，两条流程使用不同密钥方向。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#334155"/></marker></defs><rect width="960" height="340" rx="20" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="38" font-size="26" font-weight="700">不要混淆：保密与签名解决不同问题</text><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><rect x="45" y="80" width="150" height="65" rx="10"/><rect x="280" y="80" width="180" height="65" rx="10"/><rect x="545" y="80" width="180" height="65" rx="10"/><rect x="805" y="80" width="110" height="65" rx="10"/></g><g fill="#dcfce7" stroke="#16a34a" stroke-width="3"><rect x="45" y="220" width="150" height="65" rx="10"/><rect x="280" y="220" width="180" height="65" rx="10"/><rect x="545" y="220" width="180" height="65" rx="10"/><rect x="805" y="220" width="110" height="65" rx="10"/></g><g font-size="19"><text x="120" y="119">明文</text><text x="370" y="108">接收方公钥</text><text x="370" y="132">加密</text><text x="635" y="119">密文传输</text><text x="860" y="108">接收方私钥</text><text x="860" y="132">解密</text><text x="120" y="259">消息摘要</text><text x="370" y="248">发送方私钥</text><text x="370" y="272">签名</text><text x="635" y="259">消息 + 签名</text><text x="860" y="248">发送方公钥</text><text x="860" y="272">验证</text></g><g stroke="#334155" stroke-width="4" marker-end="url(#a)"><path d="M195 112H280"/><path d="M460 112H545"/><path d="M725 112H805"/><path d="M195 252H280"/><path d="M460 252H545"/><path d="M725 252H805"/></g></g></svg>
