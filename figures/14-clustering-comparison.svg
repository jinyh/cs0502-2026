<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d"><title id="t">聚类算法假设比较</title><desc id="d">KMeans 适合近似球形簇，层次聚类形成树，DBSCAN 可发现非球形簇与噪声。</desc><rect width="960" height="340" rx="20" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="160" y="40" font-size="24" font-weight="700">KMeans</text><text x="480" y="40" font-size="24" font-weight="700">层次聚类</text><text x="800" y="40" font-size="24" font-weight="700">DBSCAN</text><g fill="#2563eb"><circle cx="100" cy="120" r="8"/><circle cx="125" cy="145" r="8"/><circle cx="145" cy="105" r="8"/><circle cx="120" cy="95" r="8"/></g><g fill="#dc2626"><circle cx="205" cy="230" r="8"/><circle cx="225" cy="205" r="8"/><circle cx="250" cy="235" r="8"/><circle cx="235" cy="255" r="8"/></g><g stroke="#7c3aed" stroke-width="4"><path d="M405 245V190M555 245V190M405 190H480M555 190H480M480 190V120"/><path d="M440 245V220M520 245V220M440 220H405M520 220H555"/></g><g font-size="18"><text x="405" y="275">A</text><text x="440" y="275">B</text><text x="520" y="275">C</text><text x="555" y="275">D</text></g><path d="M710 210C720 90 890 90 900 210" fill="none" stroke="#16a34a" stroke-width="16" stroke-linecap="round"/><path d="M745 210C755 140 850 140 860 210" fill="none" stroke="#f8fafc" stroke-width="28"/><circle cx="690" cy="85" r="7" fill="#64748b"/><circle cx="905" cy="270" r="7" fill="#64748b"/><g font-size="18"><text x="160" y="300">中心 + 欧氏距离</text><text x="480" y="300">多尺度合并树</text><text x="800" y="300">密度形状 + 噪声</text></g></g></svg>
