<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">神经网络的结构偏置比较</title><desc id="d">感知器、MLP、CNN、RNN 和 Transformer 各自强调不同的结构与信息流，不表示简单替代关系。</desc><rect width="960" height="360" rx="20" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="45" font-size="28" font-weight="700" fill="#0f172a">结构偏置决定模型如何利用数据</text><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><rect x="32" y="85" width="168" height="150" rx="18"/><rect x="214" y="85" width="168" height="150" rx="18"/><rect x="396" y="85" width="168" height="150" rx="18"/><rect x="578" y="85" width="168" height="150" rx="18"/><rect x="760" y="85" width="168" height="150" rx="18"/></g><g font-size="20" font-weight="700" fill="#0f172a"><text x="116" y="125">感知器</text><text x="298" y="125">MLP</text><text x="480" y="125">CNN</text><text x="662" y="125">RNN</text><text x="844" y="125">Transformer</text></g><g font-size="17" fill="#334155"><text x="116" y="165">线性组合</text><text x="116" y="193">简单边界</text><text x="298" y="165">多层非线性</text><text x="298" y="193">一般向量</text><text x="480" y="165">局部连接</text><text x="480" y="193">参数共享</text><text x="662" y="165">递归状态</text><text x="662" y="193">顺序信息</text><text x="844" y="165">注意力聚合</text><text x="844" y="193">位置需编码</text></g><text x="480" y="285" font-size="20" fill="#475569">这些结构可以组合；选择取决于数据、任务、算力和评价证据</text><text x="480" y="320" font-size="17" fill="#64748b">不是“旧模型依次被新模型淘汰”的单向阶梯</text></g></svg>
