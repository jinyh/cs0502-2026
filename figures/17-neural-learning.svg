<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">从感知器到现代神经网络</title><desc id="d">感知器、MLP、CNN、RNN 和 Transformer 针对不同结构逐步演进。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="960" height="360" rx="20" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><path d="M90 180H875" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><circle cx="120" cy="180" r="55"/><circle cx="300" cy="180" r="55"/><circle cx="480" cy="180" r="55"/><circle cx="660" cy="180" r="55"/><circle cx="840" cy="180" r="55"/></g><g font-size="20" font-weight="700"><text x="120" y="174">感知器</text><text x="120" y="198">线性边界</text><text x="300" y="174">MLP</text><text x="300" y="198">多层非线性</text><text x="480" y="174">CNN</text><text x="480" y="198">局部与共享</text><text x="660" y="174">RNN</text><text x="660" y="198">隐藏状态</text><text x="840" y="174">Transformer</text><text x="840" y="198">注意力</text></g><g font-size="18"><text x="120" y="275">XOR 暴露限制</text><text x="300" y="275">复杂边界</text><text x="480" y="275">图像</text><text x="660" y="275">序列</text><text x="840" y="275">长程关系</text></g></g></svg>
