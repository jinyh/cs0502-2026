<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">RAG 与工具 Agent 的证据闭环</title>
  <desc id="desc">用户目标进入编排器；系统检索带权限的资料并让模型生成候选，工具调用经过验证网关，结果与引用返回并记录评价。</desc>
  <rect width="960" height="500" rx="24" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="480" y="45" font-size="29" font-weight="800" fill="#0f172a">生成不是终点：证据、工具、权限与评价构成系统</text>
    <rect x="55" y="195" width="150" height="80" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="130" y="242" font-size="22" font-weight="800" fill="#1e3a8a">用户目标</text>
    <rect x="310" y="175" width="190" height="120" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="405" y="218" font-size="24" font-weight="800" fill="#0c4a6e">编排器 / Agent</text><text x="405" y="250" font-size="17" fill="#0c4a6e">状态 · 预算 · 停止条件</text><text x="405" y="276" font-size="17" fill="#0c4a6e">日志 · 降级</text>
    <rect x="620" y="75" width="270" height="85" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="755" y="112" font-size="22" font-weight="800" fill="#14532d">检索：权限 + 排序 + 来源</text><text x="755" y="140" font-size="17" fill="#14532d">文档片段与引用</text>
    <rect x="620" y="207" width="270" height="85" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="755" y="244" font-size="22" font-weight="800" fill="#4c1d95">模型：候选生成</text><text x="755" y="272" font-size="17" fill="#4c1d95">上下文不等于事实保证</text>
    <rect x="620" y="340" width="270" height="100" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="755" y="377" font-size="22" font-weight="800" fill="#7f1d1d">工具：验证后执行</text><text x="755" y="405" font-size="17" fill="#7f1d1d">允许列表 · 参数 · 审批</text><text x="755" y="428" font-size="17" fill="#7f1d1d">幂等 · 错误语义</text>
    <path d="M205 235H310M500 205C560 155 575 118 620 118M500 235H620M500 265C560 320 575 390 620 390" stroke="#475569" stroke-width="3" fill="none"/>
    <path d="M620 140C555 140 560 190 500 205M620 272H500M620 410C550 410 555 300 500 265" stroke="#16a34a" stroke-width="3" fill="none" stroke-dasharray="9 7"/>
    <text x="405" y="355" font-size="18" font-weight="700" fill="#166534">返回：答案 + 引用 + 工具结果 + 可审计轨迹</text>
  </g>
</svg>
