<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d"><title id="t">RNN 语音识别展开</title><desc id="d">语音特征逐时刻输入，共享参数的隐藏状态传递历史并输出字符概率。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7c3aed"/></marker></defs><rect width="960" height="340" rx="20" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#ede9fe" stroke="#7c3aed" stroke-width="3"><rect x="100" y="135" width="120" height="70" rx="10"/><rect x="300" y="135" width="120" height="70" rx="10"/><rect x="500" y="135" width="120" height="70" rx="10"/><rect x="700" y="135" width="120" height="70" rx="10"/></g><g font-size="22"><text x="160" y="178">h₀</text><text x="360" y="178">h₁</text><text x="560" y="178">h₂</text><text x="760" y="178">h₃</text><text x="160" y="275">x₀</text><text x="360" y="275">x₁</text><text x="560" y="275">x₂</text><text x="760" y="275">x₃</text><text x="160" y="72">y₀</text><text x="360" y="72">y₁</text><text x="560" y="72">y₂</text><text x="760" y="72">y₃</text></g><g stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"><path d="M220 170H300"/><path d="M420 170H500"/><path d="M620 170H700"/><path d="M160 250V210"/><path d="M360 250V210"/><path d="M560 250V210"/><path d="M760 250V210"/><path d="M160 135V90"/><path d="M360 135V90"/><path d="M560 135V90"/><path d="M760 135V90"/></g><text x="480" y="320" font-size="20">同一组参数在各时间步共享；h 传递过去信息</text></g></svg>
