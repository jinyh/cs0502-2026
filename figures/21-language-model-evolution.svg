<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">语言模型演进</title><desc id="d">从 N-gram 计数到词嵌入、注意力、预训练和后训练。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="960" height="360" rx="20" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><path d="M80 180H890" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><rect x="45" y="115" width="150" height="130" rx="18"/><rect x="225" y="115" width="150" height="130" rx="18"/><rect x="405" y="115" width="150" height="130" rx="18"/><rect x="585" y="115" width="150" height="130" rx="18"/><rect x="765" y="115" width="150" height="130" rx="18"/></g><g font-size="20" font-weight="700"><text x="120" y="165">N-gram</text><text x="120" y="195">局部计数</text><text x="300" y="165">词嵌入</text><text x="300" y="195">连续向量</text><text x="480" y="165">位置 + 注意力</text><text x="480" y="195">上下文关系</text><text x="660" y="165">预训练</text><text x="660" y="195">下一 token</text><text x="840" y="165">后训练</text><text x="840" y="195">指令与偏好</text></g><text x="480" y="300" font-size="22">生成循环：概率分布 → 选择 token → 更新上下文</text></g></svg>
