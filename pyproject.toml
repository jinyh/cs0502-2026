[project]
name = "computer-introduction-course"
version = "0.1.0"
description = "计算机科学导论配套示例、实验与可信运行器"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "networkx>=3.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
