site_name: CS0502 计算机科学导论
site_description: 上海交通大学 2026 秋季计算机科学导论课程网站、知识库与主动学习工具
site_author: CS0502 课程组
site_url: https://jinyh.github.io/cs0502-2026/
repo_name: jinyh/cs0502-2026
repo_url: https://github.com/jinyh/cs0502-2026
edit_uri: edit/main/
docs_dir: src
site_dir: build
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/images/course-mark.svg
  favicon: assets/images/favicon.svg
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: README.md
  - 课程说明:
      - 课程说明首页: docs/course/overview.md
      - 完整教学日历: docs/course/schedule.md
      - 课堂、作业与考核: docs/course/policies.md
  - 拓展学习（可选）:
      - 拓展学习首页: docs/extension/README.md
      - 阅读补充:
          - 21 讲学习蓝图: docs/curriculum/README.md
          - 概念卡片: docs/cards/README.md
          - 学习路径: docs/paths/README.md
          - AI 深度专题: docs/deep/README.md
          - 前沿进展: docs/frontier/README.md
          - 术语表: docs/glossary.md
      - 动手验证:
          - 代码与实验: code/README.md
          - 形成性 Lab: code/labs/README.md
          - 交互可视化: code/visualizations/README.md
      - OpenCode 助学:
          - 学生使用指南: docs/student-guide.md
          - 安装与模型接入: opencode/tools.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

exclude_docs: |
  **/__pycache__/**
  **/*.pyc
  **/.DS_Store
  docs/README.md
  docs/assessment/**
  docs/review/**
  docs/project-status.md
  docs/curriculum/legacy-coverage-matrix.md
  opencode/AGENTS.md
  opencode/knowledge.md
  opencode/sandbox-policy.md

validation:
  links:
    not_found: warn
    anchors: warn

copyright: 2026 CS0502 课程组 · 内容 CC BY-SA 4.0 · 代码 MIT
